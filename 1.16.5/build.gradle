plugins {
    id 'eclipse'
    id 'idea'
    // ForgeGradle 6 is what Forge's own 1.16.5 MDK (36.2.42) ships with; ModDevGradle doesn't reach back to 1.16.5.
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.16.5 runs on Java 8; the foojay resolver downloads a JDK 8 if none is installed.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                 minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'awweaver',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'awweaver'
        ])
    }
    // Remap the jar back to SRG names so it loads outside the dev environment.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Just the public API (classes and sources, in dev/official names), for addon authors to compile against.
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/naverene/stevespantry/api/**'
    }
    from(sourceSets.main.allJava) {
        include 'com/naverene/stevespantry/api/**'
    }
}
tasks.named('assemble') {
    dependsOn 'apiJar'
}
