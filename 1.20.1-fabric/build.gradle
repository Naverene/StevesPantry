plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

loom {
    runs {
        server {
            // Dedicated servers want a run dir of their own and no GUI.
            runDir 'run/server'
            programArgs '--nogui'
        }
        client {
            runDir 'run/client'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang mappings, so class and method names match the NeoForge build on main.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    def props = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            minecraft_version: minecraft_version
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Just the public API (classes and sources), for addon authors to compile against. The dev
// (Mojang-named) jar is remapped to intermediary like the main jar, so addons can use
// modCompileOnly with it.
def apiJar = tasks.register('apiJar', Jar) {
    archiveClassifier = 'api-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    from(sourceSets.main.output) {
        include 'com/naverene/stevespantry/api/**'
    }
    from(sourceSets.main.allJava) {
        include 'com/naverene/stevespantry/api/**'
    }
}
def remapApiJar = tasks.register('remapApiJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = apiJar.flatMap { it.archiveFile }
    archiveClassifier = 'api'
}
tasks.named('assemble') {
    dependsOn remapApiJar
}
