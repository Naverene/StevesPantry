pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup('com.gtnewhorizons')
                includeGroupByRegex('com\\.gtnewhorizons\\..+')
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Downloads the Java 8 toolchain RFG compiles and runs Minecraft with.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'steves-pantry-1.7.10'
