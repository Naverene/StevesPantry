plugins {
    id 'java-library'
    id 'idea'
    // ModDevGradle's legacy plugin builds against Forge 1.17-1.20.1 with Mojang mappings and reobfuscates the jar to SRG.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Just the public API (classes and sources), for addon authors to compile against.
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/naverene/stevespantry/api/**'
    }
    from(sourceSets.main.allJava) {
        include 'com/naverene/stevespantry/api/**'
    }
}
tasks.named('assemble') {
    dependsOn 'apiJar'
}
